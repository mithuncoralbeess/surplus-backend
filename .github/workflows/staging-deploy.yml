name: Staging CI/CD Deployment

on:
  push:
    branches:
      - staging

jobs:
  backend-migrations:
    name: Run Database Migrations & Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Code Check & Database Migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL || secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY || secrets.SECRET_KEY || 'staging-github-ci-secret-key-12345' }}
          USE_R2: 'True'
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          python manage.py check
          if [ -n "$DATABASE_URL" ]; then
            echo "DATABASE_URL detected. Running migrations..."
            python manage.py migrate --noinput
          else
            echo "STAGING_DATABASE_URL secret is not set in GitHub. Skipping remote database migration (Render will connect directly upon deployment)."
          fi

  deploy-notify:
    needs: backend-migrations
    name: Deployment Trigger Status
    runs-on: ubuntu-latest
    steps:
      - name: Notify Status
        run: echo "Checks completed successfully. Render & Vercel builds triggered."

