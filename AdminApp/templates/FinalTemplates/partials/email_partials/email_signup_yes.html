<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7fb; margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 580px; margin: 0 auto; background: #ffffff; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; }
        .header { background: linear-gradient(135deg, #10b981, #059669); padding: 30px; text-align: center; color: #ffffff; }
        .content { padding: 30px; }
        .footer { padding: 20px 30px; background: #f8fafc; text-align: center; font-size: 12px; color: #94a3b8; border-top: 1px solid #f1f5f9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 style="margin:0; font-size: 24px;">Welcome to Surplus Market!</h1>
        </div>
        <div class="content">
            <p>Hello <strong>{{ first_name|default:"Valued Member" }}</strong>,</p>
            <p>Your account has been successfully created. You can now explore surplus listings, connect with vendors, and manage your inventory seamlessly.</p>
        </div>
        <div class="footer">&copy; Surplus Market. All rights reserved.</div>
    </div>
</body>
</html>
