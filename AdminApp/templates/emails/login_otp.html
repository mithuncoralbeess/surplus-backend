<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Surplus Market - Login OTP</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 550px; margin: 0 auto; background: #ffffff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .header { background: #1e293b; padding: 25px; text-align: center; color: #ffffff; }
        .header h1 { margin: 0; font-size: 22px; letter-spacing: 0.5px; }
        .body-content { padding: 30px 25px; text-align: center; }
        .otp-box { display: inline-block; background: #f1f5f9; border: 2px dashed #0284c7; font-size: 32px; font-weight: bold; letter-spacing: 6px; color: #0f172a; padding: 15px 30px; border-radius: 8px; margin: 20px 0; }
        .footer { background: #f8fafc; padding: 15px; text-align: center; font-size: 12px; color: #64748b; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Surplus Market Verification</h1>
        </div>
        <div class="body-content">
            <p style="font-size: 16px; margin-bottom: 5px;">Hello,</p>
            <p style="font-size: 14px; color: #475569;">Use the One-Time Password (OTP) below to sign in to your Surplus Market account.</p>
            <div class="otp-box">{{ otp_code }}</div>
            <p style="font-size: 13px; color: #64748b;">This OTP is valid for <strong>10 minutes</strong>. Please do not share this code with anyone.</p>
        </div>
        <div class="footer">
            &copy; Surplus Market. All rights reserved.
        </div>
    </div>
</body>
</html>
