<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Maintenance | Surplus Market</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .maintenance-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.25rem;
            max-width: 520px;
            width: 90%;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .shield-pulse {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(249, 115, 22, 0.15);
            color: #f97316;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(249, 115, 22, 0.3);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(249, 115, 22, 0); }
            100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
        }
    </style>
</head>
<body>
    <div class="maintenance-card text-center">
        <div class="shield-pulse">
            <i class="bi bi-shield-lock-fill fs-1"></i>
        </div>
        <h2 class="fw-bold mb-2 text-white">Under Maintenance</h2>
        <p class="text-slate-300 lead fs-6 mb-4" style="color: #cbd5e1;">
            {{ message|default:"Our platform is currently undergoing scheduled system upgrades. We will be back online shortly." }}
        </p>

        <div class="p-3 rounded-3 bg-dark bg-opacity-50 border border-secondary border-opacity-25 mb-4 text-start">
            <div class="d-flex align-items-center gap-2 small text-warning mb-1">
                <i class="bi bi-exclamation-triangle-fill"></i> System Notice:
            </div>
            <div class="small text-slate-400" style="color: #94a3b8;">
                All ongoing transactions and data are safe. If you are an administrator, you may access the dashboard.
            </div>
        </div>

        <a href="/admin/login/" class="btn btn-outline-light rounded-3 px-4 py-2 small fw-semibold">
            <i class="bi bi-shield-lock me-1"></i> Admin Portal Login
        </a>
    </div>
</body>
</html>
