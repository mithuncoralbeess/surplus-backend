{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login - Surplus Backend</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="{% static 'css/admin_login.css' %}">
    <script>
        (function() {
            document.documentElement.setAttribute('data-bs-theme', 'light');
        })();
    </script>
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center p-3 position-relative">
    <div class="ambient-background">
        <div class="glow-orb-1"></div>
        <div class="glow-orb-2"></div>
    </div>

    <main class="container position-relative" style="max-width: 440px; z-index: 10;">
        <div class="card light-login-card border rounded-4 p-4 p-md-5">
            <header class="text-center mb-4">
                <span class="badge rounded-pill badge-primary-custom px-3 py-2 mb-3 fw-semibold">
                    <i class="bi bi-shield-lock-fill me-1"></i> ENTERPRISE ADMIN
                </span>
                <h1 class="h3 fw-bold text-dark mb-1 brand-title">Surplus Portal</h1>
                <p class="text-secondary small mb-0">Enter your staff credentials to access the console</p>
            </header>

            <div id="alertBanner" class="alert alert-danger d-none align-items-center gap-2 py-2 px-3 small rounded-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span id="alertText"></span>
            </div>

            <form id="adminLoginForm">
                <div class="mb-3">
                    <label class="form-label text-dark small fw-semibold" for="user_email">Staff Email / Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-secondary border-end-0">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input
                            type="text"
                            id="user_email"
                            name="user_email"
                            class="form-control bg-light border-start-0 ps-0"
                            placeholder="super@gmail.com"
                            required
                            autocomplete="username"
                        >
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="user_pass" class="form-label text-dark small fw-semibold mb-0">Password</label>
                        <a href="javascript:void(0)" class="text-primary-custom text-decoration-none small fw-medium" id="forgotPasswordLink" data-bs-toggle="modal" data-bs-target="#otpResetModal">
                            Forgot Password?
                        </a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-secondary border-end-0">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input
                            type="password"
                            id="user_pass"
                            name="user_pass"
                            class="form-control bg-light border-start-0 border-end-0 ps-0"
                            placeholder="••••••••••••"
                            required
                            autocomplete="current-password"
                        >
                        <span class="input-group-text bg-light text-secondary border-start-0" id="togglePassBtn" style="cursor: pointer;" title="Toggle password visibility">
                            <i class="bi bi-eye" id="togglePassIcon"></i>
                        </span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm" id="submitBtn">
                    <span class="spinner-border spinner-border-sm d-none me-2" id="btnSpinner" role="status" aria-hidden="true"></span>
                    <span id="btnText">Sign In to Dashboard</span>
                </button>
            </form>
        </div>
    </main>

    <!-- SuperAdmin OTP Password Reset Modal -->
    <div class="modal fade" id="otpResetModal" tabindex="-1" aria-labelledby="otpResetModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-white border-0 shadow-lg rounded-4 p-3">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-dark" id="otpResetModalLabel">
                        <i class="bi bi-key-fill text-primary-custom me-2"></i>Reset Admin Password
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="closeModalBtn"></button>
                </div>
                <div class="modal-body pt-2">
                    <p class="text-secondary small mb-3">
                        Enter your registered SuperAdmin email to receive a secure 6-digit verification code.
                    </p>

                    <div id="modalAlert" class="alert d-none py-2 px-3 small rounded-3 mb-3"></div>

                    <!-- Step 1: Send OTP -->
                    <div id="otpStep1">
                        <div class="mb-3">
                            <label class="form-label text-dark small fw-semibold" for="resetEmail">Admin Email</label>
                            <input type="email" id="resetEmail" class="form-control bg-light" placeholder="super@gmail.com">
                        </div>
                        <button type="button" class="btn btn-primary w-100 py-2 fw-semibold" id="sendOtpBtn">
                            Send 6-Digit OTP
                        </button>
                    </div>

                    <!-- Step 2: Verify OTP & New Password -->
                    <div id="otpStep2" class="d-none">
                        <div class="mb-3">
                            <label class="form-label text-dark small fw-semibold" for="otpCode">6-Digit OTP</label>
                            <input type="text" id="otpCode" class="form-control bg-light text-center fw-bold fs-5 tracking-wide" maxlength="6" placeholder="123456">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-dark small fw-semibold" for="newPassword">New Password</label>
                            <div class="input-group">
                                <input type="password" id="newPassword" class="form-control bg-light border-end-0" placeholder="••••••••">
                                <span class="input-group-text bg-light text-secondary border-start-0" id="toggleNewPassBtn" style="cursor: pointer;">
                                    <i class="bi bi-eye" id="toggleNewPassIcon"></i>
                                </span>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-dark small fw-semibold" for="confirmNewPassword">Confirm New Password</label>
                            <div class="input-group">
                                <input type="password" id="confirmNewPassword" class="form-control bg-light border-end-0" placeholder="••••••••">
                                <span class="input-group-text bg-light text-secondary border-start-0" id="toggleConfirmPassBtn" style="cursor: pointer;">
                                    <i class="bi bi-eye" id="toggleConfirmPassIcon"></i>
                                </span>
                            </div>
                        </div>
                        <button type="button" class="btn btn-primary w-100 py-2 fw-semibold" id="verifyOtpBtn">
                            Reset Password
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Admin Login Logic -->
    <script src="{% static 'js/admin_login.js' %}"></script>
</body>
</html>
